name: check

on:
  push:
  pull_request:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax, tool inventory, doc consistency
        run: python scripts/check_repo.py
      - name: Offline statistical and text tests
        run: python -m unittest discover -s tests -v
